# The server's environment (H4, H14, H20), conda-forge only, exact versions.
# The full solved set, with SHA-256 per package, is server-win-64.lock:
#   conda create -n multimodal-server --file environments/server-win-64.lock
name: multimodal-server
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.14
  - fastapi=0.142.2
  - uvicorn=0.54.0
  - sqlalchemy=2.1.3
  - alembic=1.20.0
  - psycopg=3.3.4
  - cryptography=50.0.2
  - email-validator=2.3.0
  - pytest=9.1.1
  - httpx=0.28.1
